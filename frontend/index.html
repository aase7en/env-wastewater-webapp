<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved/OS theme before first paint to avoid a flash of the
      // wrong theme. Runtime switching lives in src/lib/theme.ts (Track F).
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script>
      // AUTH-6 (2026-07-30): restore the GitHub-Pages SPA-redirect stash
      // BEFORE any module loads. The 404.html fallback (see
      // scripts/github-pages-spa-redirect.html) hard-replaces the URL to
      // the SPA root for deep links like /auth/callback, stashing the
      // original path (+?code= /#access_token=) in sessionStorage. The old
      // restore lived in main.tsx — but main.tsx runs AFTER module imports
      // resolve, and `import { supabase }` triggers createClient() with
      // detectSessionInUrl:true at import time. By then the URL had already
      // been hard-replaced to the root, so the OAuth token/code was gone —
      // Supabase never detected the session, and login looped back to
      // /login. Moving the restore to an inline head script guarantees it
      // runs before the module graph executes.
      (function () {
        try {
          var stash = sessionStorage.getItem("gh-pages-spa-redirect");
          if (stash) {
            sessionStorage.removeItem("gh-pages-spa-redirect");
            window.history.replaceState(null, "", stash);
          }
        } catch (e) {
          // sessionStorage may be unavailable (private mode); fall through —
          // deep-link restore is best-effort, not a hard requirement.
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon-aura.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00161B" />
    <meta name="description" content="ระบบบันทึกและติดตามคุณภาพน้ำทิ้ง ระบบบำบัดน้ำเสีย โรงพยาบาลอุทัย" />
    <title>UTH[AI]-ENV — ระบบบำบัดน้ำเสีย รพ.อุทัย</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
